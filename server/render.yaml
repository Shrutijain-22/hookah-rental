services:
  - type: web
    name: velvet-smoke-api
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BUSINESS_EMAIL
        value: owner@velvetsmoke-rentals.com
